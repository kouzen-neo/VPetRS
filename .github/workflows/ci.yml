name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Test, Zero-.NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system Wayland & D-Bus headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libfontconfig1-dev libdbus-1-dev pkg-config
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit & snapshot tests
        run: cargo test --workspace
      - name: Release build & zero-.NET verification
        run: |
          cargo build --release -p vpet-app
          ./scripts/check-no-dotnet.sh
