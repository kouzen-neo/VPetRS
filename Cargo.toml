[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/content",
  "crates/render",
  "crates/wayland",
  "crates/app",
  "crates/mods",
  "crates/steam",
]
default-members = [
  "crates/core",
  "crates/content",
  "crates/render",
  "crates/wayland",
  "crates/app",
  "crates/mods",
]

[workspace.package]
version = "1.3.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kouzen-neo/VPetRS"
homepage = "https://github.com/kouzen-neo/VPetRS"

[workspace.dependencies]
vpet-core = { path = "crates/core" }
vpet-content = { path = "crates/content" }
vpet-render = { path = "crates/render" }
vpet-wayland = { path = "crates/wayland" }
vpet-mods = { path = "crates/mods" }

anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
cosmic-text = "0.19"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thiserror = "2.0"
toml = "0.8"
ureq = { version = "3.5", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system"] }
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
